    Este archivo, no `public/favicon.svg`, es el que termina viéndose en la pestaña.
    `app/icon.svg` es una convención de archivo del App Router: Next inyecta su propio
    `<link rel="icon">` y tiene precedencia sobre el que declara `metadata.icons`. Los dos
