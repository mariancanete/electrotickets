<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ElectroTickets">
  <rect width="64" height="64" rx="16" fill="#050507"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <defs>
    <linearGradient id="electroGradient" x1="18" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="electroGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.45 0 0 0 0 1 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="skewX(-12) translate(6 0)" filter="url(#electroGlow)">
    <rect x="18" y="16" width="30" height="7" rx="2" fill="url(#electroGradient)"/>
    <rect x="18" y="28.5" width="23" height="7" rx="2" fill="url(#electroGradient)"/>
    <rect x="18" y="41" width="30" height="7" rx="2" fill="url(#electroGradient)"/>
  </g>
</svg>
