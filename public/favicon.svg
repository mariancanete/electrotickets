<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ElectroTickets">
  <!--
    Misma marca que el header: ticket troquelado con el rayo calado, en un solo color plano.
    El favicon original eran tres barras finas con degradé de tres paradas y blur, y a 16px
    —que es el tamaño real de una pestaña— se convertía en una mancha. Esta silueta sobrevive
    a esa reducción porque es forma y no dibujo, y es exactamente la misma figura que el logo
    del header y que la perforación de cada fila de la agenda.
  -->
  <path
    fill="#3DE8F5"
    fill-rule="evenodd"
    d="M21 8h22a13 13 0 0 1 13 13v4.5a6.5 6.5 0 0 0 0 13V43a13 13 0 0 1-13 13H21A13 13 0 0 1 8 43v-4.5a6.5 6.5 0 0 0 0-13V21A13 13 0 0 1 21 8Zm16 5L18 37h11.5l-3.5 16 18-25H31l6-15Z"
  />
</svg>
