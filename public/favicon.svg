<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ElectroTickets">
  <!--
    Monograma ET. El favicon anterior eran tres barras finas con degradé y blur: a 16px, que
    es el tamaño real de una pestaña, se convertía en una mancha. Un monograma sólido en un
    solo color sobrevive a esa reducción y sigue siendo el mismo objeto en el avatar y en el
    header del sitio.
  -->
  <rect width="64" height="64" rx="16" fill="#0B0714"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3DE8F5" stroke-opacity="0.35"/>

  <!-- E -->
  <rect x="14" y="20" width="15" height="5"   rx="1" fill="#3DE8F5"/>
  <rect x="14" y="20" width="5"  height="24"  rx="1" fill="#3DE8F5"/>
  <rect x="14" y="29.5" width="12" height="5" rx="1" fill="#3DE8F5"/>
  <rect x="14" y="39" width="15" height="5"   rx="1" fill="#3DE8F5"/>

  <!-- T -->
  <rect x="33" y="20" width="17" height="5"   rx="1" fill="#FFFFFF"/>
  <rect x="39" y="20" width="5"  height="24"  rx="1" fill="#FFFFFF"/>
</svg>
